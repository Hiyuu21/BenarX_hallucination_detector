name: Daily News Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC (8:00 AM MYT)
  workflow_dispatch:    # Enables manual trigger from your phone

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser trafilatura pandas

      - name: Run Scraper
        run: python src/pipeline/daily_scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Force add the DB file (bypassing .gitignore) so the data is saved
          git add -f data/db/malaysian_news_db/malaysian_news.db
          
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "Automated daily news scrape: $(date +'%Y-%m-%d')"
          git push
